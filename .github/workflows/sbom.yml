---
name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release-v*'
      - 'release'
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}#See guidance on how to set appropriate actions at workflow or job level

jobs:
  sbom:
    permissions:
      actions: read
      contents: write
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@fdf6144ffad34d84dcf205763988e29490801d4d
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}