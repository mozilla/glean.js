---
name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release-v*'
      - 'release'
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}#See guidance on how to set appropriate actions at workflow or job level

jobs:
  sbom:
    permissions:
      actions: read
      contents: write
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@c545f6aed7a9d5cae69d775845e8a3099f4ee290
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}