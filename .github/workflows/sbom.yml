---
name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release-v*'
      - 'release'
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}#See guidance on how to set appropriate actions at workflow or job level

jobs:
  sbom:
    permissions:
      actions: read
      contents: write
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@511b5b2a48f5b24bc31315c6042c275362746be8
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}