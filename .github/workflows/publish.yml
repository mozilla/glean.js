name: Publish
on:
  push:
    tags:
      - /^v.*/
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: latest
      - name: Install JS Dependencies
        run: npm --prefix ./glean install