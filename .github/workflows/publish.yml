name: Publish
on:
  push:
    tags:
      - /^v.*/
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install JS Dependencies
        run: npm --prefix ./glean install